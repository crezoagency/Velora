.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 20px 4px;scrollbar-width:none}
.chip{white-space:nowrap;padding:7px 16px;border-radius:99px;border:1px solid var(--ln);color:var(--mut);cursor:pointer;font-size:.88rem;user-select:none}

h2{font-family:var(--serif);font-size:1.4rem;font-weight:700;padding:26px 20px 12px}

label{display:block;font-size:.78rem;color:var(--mut);margin:14px 0 5px;letter-spacing:.04em}

.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.arow{display:flex;gap:8px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--s2);margin-top:7px}
